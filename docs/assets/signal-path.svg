<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title description">
  <title id="title">TapTune signal path</title>
  <desc id="description">An NFC tag passes through a PN532 I2C reader and Python service to Spotify playback, while SQLite stores tag assignments.</desc>
  <rect width="960" height="620" fill="#1e282e"/>
  <g stroke="#39434a" stroke-width="1">
    <path d="M0 124h960M0 248h960M0 372h960M0 496h960"/>
    <path d="M160 0v620M320 0v620M480 0v620M640 0v620M800 0v620"/>
  </g>

  <g fill="none" stroke-linecap="square">
    <path d="M184 196h126" stroke="#f06328" stroke-width="4"/>
    <path d="M446 196h92" stroke="#f06328" stroke-width="4"/>
    <path d="M690 196h86" stroke="#20734f" stroke-width="4"/>
    <path d="M614 286v112" stroke="#1945e8" stroke-width="4"/>
    <path d="M300 190l10 6-10 6M528 190l10 6-10 6M766 190l10 6-10 6M608 388l6 10 6-10" stroke="#fbfaf5" stroke-width="2"/>
  </g>

  <g font-family="DM Sans, Arial, sans-serif">
    <g transform="translate(44 112)">
      <rect width="140" height="168" fill="#f06328" stroke="#11181d"/>
      <circle cx="70" cy="62" r="34" fill="none" stroke="#182027" stroke-width="2"/>
      <circle cx="70" cy="62" r="22" fill="none" stroke="#182027" stroke-width="2" stroke-dasharray="4 5"/>
      <rect x="58" y="50" width="24" height="24" fill="none" stroke="#182027" stroke-width="2"/>
      <text x="18" y="126" fill="#182027" font-size="22" font-weight="700">NFC tag</text>
      <text x="18" y="148" fill="#182027" font-family="DM Mono, monospace" font-size="12">physical input</text>
    </g>

    <g transform="translate(310 132)">
      <rect width="136" height="128" fill="#f4f1e8" stroke="#11181d"/>
      <path d="M30 32h76v46H30zM38 40h60v30H38z" fill="none" stroke="#1945e8" stroke-width="2"/>
      <path d="M44 56c8-12 16-12 24 0s16 12 24 0" fill="none" stroke="#1945e8" stroke-width="2"/>
      <text x="18" y="98" fill="#182027" font-size="20" font-weight="700">PN532</text>
      <text x="18" y="116" fill="#5c635f" font-family="DM Mono, monospace" font-size="11">I2C reader</text>
    </g>

    <g transform="translate(538 92)">
      <rect width="152" height="208" fill="#1945e8" stroke="#11181d"/>
      <path d="M28 36h96v72H28zM42 50h26v18H42zM82 50h28v44H82zM42 80h26v14H42z" fill="none" stroke="#fbfaf5" stroke-width="2"/>
      <circle cx="42" cy="122" r="4" fill="#f06328"/>
      <circle cx="58" cy="122" r="4" fill="#20734f"/>
      <text x="20" y="158" fill="#fbfaf5" font-size="21" font-weight="700">Python</text>
      <text x="20" y="181" fill="#fbfaf5" font-size="21" font-weight="700">service</text>
      <text x="20" y="197" fill="#aebeff" font-family="DM Mono, monospace" font-size="10">dispatch + web UI</text>
    </g>

    <g transform="translate(776 126)">
      <rect width="140" height="140" rx="70" fill="#20734f" stroke="#11181d"/>
      <path d="M39 58c22-8 43-6 64 4M43 76c19-6 37-4 55 3M48 93c14-4 28-3 41 2" fill="none" stroke="#fbfaf5" stroke-width="5" stroke-linecap="round"/>
      <text x="37" y="121" fill="#fbfaf5" font-size="18" font-weight="700">Playback</text>
    </g>

    <g transform="translate(538 398)">
      <rect width="152" height="116" fill="#f4f1e8" stroke="#11181d"/>
      <ellipse cx="76" cy="28" rx="44" ry="14" fill="none" stroke="#f06328" stroke-width="2"/>
      <path d="M32 28v38c0 8 20 14 44 14s44-6 44-14V28M32 47c0 8 20 14 44 14s44-6 44-14" fill="none" stroke="#f06328" stroke-width="2"/>
      <text x="20" y="103" fill="#182027" font-size="18" font-weight="700">SQLite</text>
    </g>

    <text x="44" y="52" fill="#aeb3b0" font-family="DM Mono, monospace" font-size="12" letter-spacing="2">TAPTUNE / SIGNAL PATH</text>
    <text x="44" y="568" fill="#aeb3b0" font-family="DM Mono, monospace" font-size="12">One UID in. One inspectable playback intent out.</text>
  </g>
</svg>
